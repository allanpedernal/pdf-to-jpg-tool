name: Publish Blog Post

# Auto-generates an original blog post on a schedule and opens a Pull Request
# for you to review before it goes live. Runs Mon/Wed/Fri at 09:00 UTC.
# You can also trigger it manually from the Actions tab.

on:
  schedule:
    - cron: '0 9 * * 1,3,5'   # Mon, Wed, Fri @ 09:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'How many posts to generate'
        required: false
        default: '1'
      dry_run:
        description: 'Generate but do not commit (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  models: read          # access GitHub Models (free GPT-4o-mini) via GITHUB_TOKEN

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate post(s)
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # GitHub Models first (free, no extra secret), then Groq, then Gemini.
          AI_PROVIDER_ORDER: github,groq,gemini
        run: |
          node scripts/generate-post.js \
            --count "${{ github.event.inputs.count || '1' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Create Pull Request
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "blog: add ${{ steps.gen.outputs.created_titles || 'new post(s)' }}"
          branch: auto-blog/run-${{ github.run_id }}
          delete-branch: true
          title: "📝 New blog post: ${{ steps.gen.outputs.created_titles || 'auto-generated draft' }}"
          labels: |
            automated
            blog
          add-paths: |
            blog/**
            sitemap.xml
            sw.js
          body: |
            ## Auto-generated blog post

            This PR was created by the **Publish Blog Post** workflow.

            - **New post(s):** ${{ steps.gen.outputs.created_titles || 'see diff' }}
            - **Count:** ${{ steps.gen.outputs.created_count || '0' }}

            ### Before merging — quick human review (keeps us clear of Google's scaled-content policy)
            - [ ] Title and intro are accurate and not misleading
            - [ ] Facts/steps are correct (no invented claims or numbers)
            - [ ] Reads naturally; no obvious AI tics or repetition
            - [ ] Cover image is appropriate
            - [ ] Internal tool links work

            Merge to publish (GitHub Pages will redeploy automatically), or close to discard.
